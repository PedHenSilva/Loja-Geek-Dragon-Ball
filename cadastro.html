<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style-login.css">
    <link rel="stylesheet" href="assets/css/loading.css">
    <script src="https://kit.fontawesome.com/0c7fbaa498.js" crossorigin="anonymous"></script>
    <link rel="shortcut icon" href="assets/img/favicon.ico" type="image/x-icon">

    <!-- Script de Cadastro -->
    <script src="assets/js/login.js"></script>

    <meta charset="UTF-8">
    <title>Criar Conta</title>
</head>
<body>

    <div class="preloader" id="preloader">
        <div class="loader" id="loader"></div>
    </div>

        <header>
        <div class="container-fluid">
            <div class="logo">
                <img src="assets/img/Adobe Express - file (1).png" alt="DBOSlogo">
            </div>
            <div class="menu">
                <nav>
                    <a href="index.html" target="_self">Home</a>
                    <a href="sobre.html" target="_self">Sobre</a>
                    <a href="https://github.com/PedHenSilva/Loja-Geek-Dragon-Ball" target="_blank" rel="noopener noreferrer">GitHub</a>
                </nav>
            </div>
            <div class="socials">
                <button>
                    <i class="fa-solid fa-cart-shopping"></i>
                </button>

                <a href="login.html" target="_blank" rel="noopener noreferrer">
                    <button>
                        <i class="fa-solid fa-user"></i>
                    </button>
                </a>
            </div>    
        </div>
    </header>
    

    <main>
        <div class="login-container">
            <form class="formlogin">
                <h1 class="titulo-login">Criar Conta</h1>

                <div class="form-group">
                    <label for="login">Nome de usuário</label>
                    <input type="text" class="form-control input-login" id="login" placeholder="Insira seu nome de usuário">
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" class="form-control input-login" id="email" placeholder="Insira seu e-mail">
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" class="form-control input-login" id="senha" placeholder="Insira sua senha">
                </div>

                <button type="button" class="btn-login" onclick="cadastrar()">Cadastrar</button>

                <p style="margin-top: 15px; text-align: center;">
                    Já tem conta? <a href="login.html">Faça login</a>
                </p>
            </form>
        </div>
    </main>

   <footer>
        <div class="fundofooter">
            <div class="footer">            
                <div class="titulo">
                    <h4>
                        Av. Luiz Merenda, 443 - Campanário, Diadema
                    </h4>
                    <h3>
                        Copyright © 2025 | Todos os direitos reservados.
                    </h3>
                </div>
                <div class="logos">
                    <img src="assets/img/DBlogo.png" alt="DBClássico">
                    <img src="assets/img/DBZLogo.png" alt="DragonBallZ">
                    <img src="assets/img/DBSLogo.png" alt="DragonBallSuper">
                </div>
            </div>  
        </div>
    </footer>

    <script src="assets/js/script_preloader.js"></script>
</body>
</html>
